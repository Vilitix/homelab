<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Homelab</h1>
        <div class="settings">
            <label for="base-url">Base URL:</label>
            <input type="text" id="base-url" value="http://localhost" placeholder="http://192.168.1.100">
        </div>
    </header>

    <main id="dashboard">
        <!-- populated by js -->
    </main>

    <script>
        // Force the browser to always fetch the latest version of script.js without caching
        document.write('<script src="script.js?v=' + Date.now() + '"><\/script>');
    </script>
</body>
</html>
