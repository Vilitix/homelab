services:
  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    mem_limit: 2g
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "2342:2342"
    environment:
      PHOTOPRISM_ADMIN_PASSWORD: ${PHOTOPRISM_ADMIN_PASSWORD}
      PHOTOPRISM_AUTH_MODE: "password"
      PHOTOPRISM_SITE_URL: "http://localhost:2342/"
      PHOTOPRISM_ORIGINALS_LIMIT: -1
      PHOTOPRISM_HTTP_PORT: 2342
      PHOTOPRISM_DEBUG: "false"
      PHOTOPRISM_PUBLIC: "false"
      PHOTOPRISM_READONLY: "false"
      PHOTOPRISM_UID: 1000
      PHOTOPRISM_GID: 1000
      PHOTOPRISM_UMASK: "0002"
      TZ: Europe/Paris
      # Intel iGPU QuickSync / VA-API hardware acceleration for Zenbook 13
      PHOTOPRISM_FFMPEG_ENCODER: "intel"
      # MariaDB database connection
      PHOTOPRISM_DATABASE_DRIVER: "mysql"
      PHOTOPRISM_DATABASE_SERVER: "mariadb:3306"
      PHOTOPRISM_DATABASE_NAME: "photoprism"
      PHOTOPRISM_DATABASE_USER: "photoprism"
      PHOTOPRISM_DATABASE_PASSWORD: ${PHOTOPRISM_DATABASE_PASSWORD}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${HOMELAB_DIR}/containers/photoprism/storage:/photoprism/storage
      - /mnt/storage/media/photos:/photoprism/originals/photos
      - /mnt/storage/media/videos:/photoprism/originals/videos
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    container_name: photoprism-mariadb
    mem_limit: 1g
    command: --innodb-buffer-pool-size=512M --transaction-isolation=READ-COMMITTED --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=512 --innodb-rollback-on-timeout=1 --innodb-lock-wait-timeout=120
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
      MARIADB_DATABASE: "photoprism"
      MARIADB_USER: "photoprism"
      MARIADB_PASSWORD: ${PHOTOPRISM_DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - ${HOMELAB_DIR}/containers/photoprism/database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
