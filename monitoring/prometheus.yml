global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "prometheus_rules.yml"

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080', 'node-exporter:9100']
    metric_relabel_configs:
      # Drop host systemd services, slices, and root cgroups
      - source_labels: [id]
        regex: '.*\.service|/user\.slice.*|/init\.scope|^/system\.slice$|^/$'
        action: drop
