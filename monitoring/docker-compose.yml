services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    mem_limit: 128m
    cpus: 0.2
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/containerd/containerd.sock:/var/run/containerd/containerd.sock:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
      - '--disable_metrics=disk,diskIO,tcp,udp,advtcp,percpu,sched,hugetlb,referenced_memory,resctrl'
    ports:
      - "8080:8080"
    networks:
      - monitoring-net

  cadvisor-helper:
    image: docker:cli
    container_name: cadvisor-helper
    mem_limit: 128m
    cpus: 0.2
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker
    command: >
      sh -c '
        while true; do
          for id in $$(docker ps --no-trunc -q); do
            dir="/var/lib/docker/image/overlay2/layerdb/mounts/$$id"
            if [ ! -d "$$dir" ]; then
              mkdir -p "$$dir"
              echo "$$dir" > "$$dir/mount-id"
            fi
          done
          sleep 15
        done
      '
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    mem_limit: 128m
    cpus: 0.2
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    networks:
      - monitoring-net

  ntfy:
    build:
      context: ./ntfy
    container_name: ntfy
    mem_limit: 128m
    cpus: 0.2
    restart: unless-stopped
    environment:
      - NTFY_TOPIC=${NTFY_TOPIC}
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring-net

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.2
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=900
      - CURL_TIMEOUT=15
      - WEBHOOK_URL=https://ntfy.sh/${NTFY_TOPIC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring-net


  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=604800
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=ntfy://ntfy.sh/${NTFY_TOPIC}?title=Watchtower
      - WATCHTOWER_NOTIFICATION_SKIP_TITLE=true
      - WATCHTOWER_NOTIFICATION_REPORT=true
      - |
        WATCHTOWER_NOTIFICATION_TEMPLATE=
        {{- if .Report -}}
          {{- with .Report -}}
            {{len .Updated}} Containers Updated:
            {{- range .Updated}}
            - {{.Name}}
            {{- end -}}
          {{- end -}}
        {{- else -}}
          {{range .Entries -}}{{.Message}}{{println}}{{- end -}}
        {{- end -}}
      - DOCKER_API_VERSION=1.41
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
