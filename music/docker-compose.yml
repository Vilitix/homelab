services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4533/ping"]
      interval: 15m
      timeout: 10s
      retries: 3
    user: "1000:1000"
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=
      - ND_MUSICFOLDER=/music
      - ND_LASTFM_ENABLED=true
      - ND_LASTFM_LANGUAGE=en
      - ND_LISTENBRAINZ_ENABLED=true
      # Optional: Add your free Last.fm API key/secret below for personalized scrobble radios
      - ND_LASTFM_APIKEY=${LASTFM_API_KEY:-}
      - ND_LASTFM_SECRET=${LASTFM_SECRET:-}
    volumes:
      - ${HOMELAB_DIR}/containers/navidrome/data:/data
      - /mnt/storage/media/music/arthur:/music:ro
    restart: unless-stopped

  navidrome-karine:
    image: deluan/navidrome:latest
    container_name: navidrome-karine
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4533/ping"]
      interval: 15m
      timeout: 10s
      retries: 3
    user: "1000:1000"
    ports:
      - "4534:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=
      - ND_MUSICFOLDER=/music
    volumes:
      - ${HOMELAB_DIR}/containers/navidrome-karine/data:/data
      - /mnt/storage/media/music/karine:/music:ro
    restart: unless-stopped


  musicgrabber-arthur:
    image: g33kphr33k/musicgrabber:latest
    container_name: musicgrabber-arthur
    shm_size: '2gb'
    ports:
      - "38274:8080"
    volumes:
      - ${HOMELAB_DIR}/containers/musicgrabber-arthur/data:/data
      - /mnt/storage/media/music/arthur:/music
    environment:
      - MUSIC_DIR=/music
      - ENABLE_MUSICBRAINZ=true
    restart: unless-stopped

  musicgrabber-karine:
    image: g33kphr33k/musicgrabber:latest
    container_name: musicgrabber-karine
    shm_size: '2gb'
    ports:
      - "38275:8080"
    volumes:
      - ${HOMELAB_DIR}/containers/musicgrabber-karine/data:/data
      - /mnt/storage/media/music/karine:/music
    environment:
      - MUSIC_DIR=/music
      - ENABLE_MUSICBRAINZ=true
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:nightly
    container_name: lidarr
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 15m
      timeout: 10s
      retries: 3
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${HOMELAB_DIR}/containers/lidarr/config:/config
      - /mnt/storage/media/music:/music
      - /mnt/storage/downloads/music:/downloads
    ports:
      - "8686:8686"
    networks:
      - default
      - stream_default
    restart: unless-stopped



networks:
  default:
  stream_default:
    external: true
