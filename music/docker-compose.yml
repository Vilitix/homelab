services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "1000:1000"
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=
      - ND_MUSICFOLDER=/music
      - ND_LASTFM_ENABLED=true
      - ND_LASTFM_LANGUAGE=en
      - ND_LISTENBRAINZ_ENABLED=true
      # Optional: Add your free Last.fm API key/secret below for personalized scrobble radios
      - ND_LASTFM_APIKEY=${LASTFM_API_KEY:-}
      - ND_LASTFM_SECRET=${LASTFM_SECRET:-}
    volumes:
      - ${HOMELAB_DIR}/containers/navidrome/data:/data
      - /mnt/storage/media/music:/music:ro
    restart: unless-stopped

  spotdl-web:
    image: spotdl/spotify-downloader:latest
    container_name: spotdl-web
    command: web --host 0.0.0.0 --port 8888
    ports:
      - "8888:8888"
    volumes:
      - ${HOMELAB_DIR}/containers/spotdl/config:/root/.spotdl
      - /mnt/storage/media/music:/music
    working_dir: /music
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${HOMELAB_DIR}/containers/lidarr/config:/config
      - /mnt/storage/media/music:/music
      - /mnt/storage/downloads/music:/downloads
    ports:
      - "8686:8686"
    networks:
      - default
      - stream_default
    restart: unless-stopped

networks:
  default:
  stream_default:
    external: true
