name: obsidian

services:
  couchdb:
    image: couchdb:3.4
    restart: unless-stopped
    ports:
      - "5984:5984"
    env_file:
      - path: .env
        required: true
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - COUCHDB_SECRET=${COUCHDB_SECRET:-change-this-secret}
      - COUCHDB_ERLANG_COOKIE=${COUCHDB_ERLANG_COOKIE:-change-this-erlang-cookie}
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.ini
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u \"$${COUCHDB_USER}:$${COUCHDB_PASSWORD}\" http://127.0.0.1:5984/_up >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  couchdb-data: